<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="献立アプリ">
<title>献立アプリ</title>
<style>
:root {
  --bg: #f8f5f0;
  --surface: #fff;
  --surface2: #f2ede6;
  --accent: #e07b39;
  --accent2: #c05f1f;
  --green: #4a9e6b;
  --text: #2d2416;
  --text2: #8a7560;
  --border: #e0d5c5;
  --red: #e05050;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.app { max-width: 480px; margin: 0 auto; padding: 16px; padding-bottom: 80px; }
h1 { font-size: 22px; font-weight: 800; padding: 16px 0 20px; }

/* Tabs */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
  padding: 8px 8px 28px; gap: 4px; z-index: 50;
}
.nav-btn {
  padding: 8px 4px 6px;
  border: none; border-radius: 12px;
  background: transparent; color: var(--text2);
  font-size: 10px; cursor: pointer;
  transition: all 0.2s; font-weight: 600;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.nav-btn .nav-icon { font-size: 22px; line-height: 1; }
.nav-btn.active { background: var(--accent); color: #fff; }
.nav-btn.active .nav-icon { transform: scale(1.1); }

/* Cards */
.card { background: var(--surface); border-radius: 14px; padding: 16px; border: 1px solid var(--border); margin-bottom: 12px; }
.section-title { font-size: 12px; color: var(--text2); font-weight: 700; letter-spacing: 0.5px; margin-bottom: 10px; text-transform: uppercase; }

/* Input */
.input { width: 100%; padding: 12px 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 15px; outline: none; }
.input:focus { border-color: var(--accent); }
textarea.input { resize: none; min-height: 80px; }
.btn { padding: 12px 20px; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
.btn:hover { opacity: 0.85; }
.btn-primary { background: var(--accent); color: #fff; width: 100%; margin-top: 8px; }
.btn-small { background: var(--surface2); color: var(--text); font-size: 13px; padding: 6px 12px; border: 1px solid var(--border); }
.btn-danger { background: transparent; color: var(--red); border: 1px solid var(--red); font-size: 12px; padding: 4px 10px; }
.btn-green { background: var(--green); color: #fff; }

/* Tag */
.tag { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; background: var(--surface2); color: var(--text2); margin: 2px; cursor: pointer; border: 1px solid var(--border); }
.tag.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.tag-remove { background: var(--accent); color: #fff; border-color: var(--accent); }

/* Category tags */
.cat-tag { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; margin: 2px; cursor: pointer; border: 1px solid transparent; }
.cat-tag.active, .cat-tag:hover { opacity: 1; }
.cat-メイン料理  { background:#fde8d8; color:#c05f1f; border-color:#f5c0a0; }
.cat-副菜       { background:#d8f0e0; color:#2d7a4a; border-color:#a0dbb8; }
.cat-汁物       { background:#fdf5d8; color:#a07820; border-color:#f0d890; }
.cat-箸休め     { background:#e8d8f5; color:#6030a0; border-color:#c8a0e0; }
.cat-おつまみ   { background:#ffd8d8; color:#a03030; border-color:#f0a0a0; }
.cat-麺         { background:#d8e8f5; color:#2050a0; border-color:#a0c0e8; }
.cat-ご飯もの   { background:#f5f0d8; color:#807030; border-color:#e0d890; }
.cat-鍋・煮物   { background:#fce8e0; color:#904020; border-color:#e8b090; }
.cat-炒め物     { background:#fff0d8; color:#906020; border-color:#e8c880; }
.cat-揚げ物     { background:#fffad8; color:#807020; border-color:#e8d870; }
.cat-蒸し料理   { background:#e0f0f8; color:#206080; border-color:#90c8e0; }
.cat-サラダ     { background:#e8f8e0; color:#306020; border-color:#a0d880; }
.cat-デザート   { background:#fde0ee; color:#a03060; border-color:#f0a0c8; }
.cat-パン・粉もの { background:#f8ead8; color:#805030; border-color:#d8b090; }
.cat-朝食向け   { background:#e8f0ff; color:#3050a0; border-color:#a0b8f0; }
.cat-弁当向け   { background:#e0f8e8; color:#205040; border-color:#80d0a0; }
.cat-その他     { background:var(--surface2); color:var(--text2); border-color:var(--border); }
.cat-すべて     { background:var(--surface2); color:var(--text2); border-color:var(--border); }

/* Recipe */
.recipe-item { background: var(--surface); border-radius: 12px; padding: 14px; border: 1px solid var(--border); margin-bottom: 8px; }
.recipe-name { font-size: 16px; font-weight: 700; }
.recipe-meta { font-size: 12px; color: var(--text2); }
.recipe-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.fav-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 0; line-height: 1; }

/* Edit Modal */
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: flex-end; justify-content: center; }
.modal-bg.show { display: flex; }
.modal { background: var(--surface); border-radius: 20px 20px 0 0; padding: 20px 16px 40px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
.modal-title { font-size: 18px; font-weight: 800; margin-bottom: 16px; }

/* Special tags */
.spec-tag { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; margin: 2px; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; }
.spec-tag.active { transform: scale(1.05); }
.spec-お気に入り { background:#fff0f5; color:#c0306a; border-color:#f0a0c0; }
.spec-お気に入り.active { background:#c0306a; color:#fff; }
.spec-子供向け { background:#fff8e0; color:#b07000; border-color:#e8c860; }
.spec-子供向け.active { background:#d08000; color:#fff; }
.spec-大人向け { background:#f0e8f8; color:#6030a0; border-color:#c090e0; }
.spec-大人向け.active { background:#6030a0; color:#fff; }
.spec-簡単 { background:#e8f8e0; color:#2d7a4a; border-color:#90d870; }
.spec-簡単.active { background:#2d7a4a; color:#fff; }
.spec-時短 { background:#e0f0ff; color:#2050a0; border-color:#80b0f0; }
.spec-時短.active { background:#2050a0; color:#fff; }
.spec-作り置き { background:#f5f0e0; color:#806020; border-color:#d0b870; }
.spec-作り置き.active { background:#806020; color:#fff; }
.spec-ヘルシー { background:#e0f8f0; color:#206050; border-color:#70d0b0; }
.spec-ヘルシー.active { background:#206050; color:#fff; }
.spec-節約 { background:#f8f0e0; color:#804020; border-color:#d09060; }
.spec-節約.active { background:#804020; color:#fff; }

/* Meal plan */
.meal-item { border-radius: 12px; padding: 14px; border: 1px solid var(--border); margin-bottom: 8px; background: var(--surface); }
.meal-day { font-size: 12px; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
.meal-name { font-size: 15px; font-weight: 700; }
.meal-note { font-size: 12px; color: var(--text2); margin-top: 4px; }

/* Shopping */
.shop-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.shop-check { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.shop-check.checked { background: var(--green); border-color: var(--green); color: #fff; }
.shop-name { font-size: 15px; flex: 1; }
.shop-name.done { text-decoration: line-through; color: var(--text2); }

/* Loading */
.loading { text-align: center; color: var(--text2); padding: 32px; font-size: 14px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; background: var(--green); color: #fff; margin-left: 6px; }

/* Notification */
.notif { position: fixed; top: 12px; left: 12px; right: 12px; max-width: 480px; margin: 0 auto; background: var(--text); color: #fff; padding: 12px 16px; border-radius: 12px; font-size: 13px; font-weight: 500; z-index: 200; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.notif.show { opacity: 1; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="notif" id="notif"></div>

  <!-- 食材タブ -->
  <div id="tab-ingredients">
    <h1>🥕 食材管理</h1>

    <!-- レシート読み取り -->
    <div class="card" style="border:2px dashed var(--accent);background:rgba(224,123,57,0.05)">
      <div class="section-title">📷 レシートから自動読み取り</div>
      <input type="file" id="receipt-input" accept="image/*" capture="environment" style="display:none" onchange="readReceipt(event)">
      <button class="btn btn-primary" style="background:var(--accent);margin-top:0" onclick="document.getElementById('receipt-input').click()">
        📸 レシートを撮影・選択
      </button>
      <div id="receipt-preview" style="margin-top:10px;display:none">
        <img id="receipt-img" style="width:100%;border-radius:8px;max-height:200px;object-fit:cover">
        <div id="receipt-status" style="font-size:13px;color:var(--text2);margin-top:6px;text-align:center"></div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">手動で食材を追加</div>
      <div style="display:flex;gap:8px">
        <input class="input" id="ing-input" placeholder="例：鶏肉、玉ねぎ..." style="flex:1">
        <button class="btn btn-small" onclick="addIngredient()">追加</button>
      </div>
      <div id="ing-tags" style="margin-top:10px;"></div>
    </div>
    <button class="btn btn-primary btn-green" onclick="showTab('plan');generatePlan()" style="margin-top:4px;">
      🍳 この食材で献立を作る
    </button>

  </div>

  <!-- レシピ一覧タブ -->
  <div id="tab-recipes" style="display:none">
    <h1>📖 レシピ</h1>

    <!-- 表示切り替え -->
    <div style="display:flex;gap:6px;margin-bottom:12px">
      <button class="btn btn-small" id="view-btn-list" onclick="setRecipeView('list')" style="flex:1;background:var(--accent);color:#fff">一覧</button>
      <button class="btn btn-small" id="view-btn-ingredient" onclick="setRecipeView('ingredient')" style="flex:1">食材別</button>
    </div>

    <!-- 食材別ビュー -->
    <div id="recipe-view-ingredient" style="display:none">
      <div id="ingredient-filter"></div>
      <div id="ingredient-recipe-list" style="margin-top:12px"></div>
    </div>

    <!-- 一覧ビュー -->
    <div id="recipe-view-list">
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <input class="input" id="recipe-search" placeholder="🔍 料理名で検索..." style="flex:1;padding:10px 14px" oninput="renderRecipes()">
      </div>
      <div id="cat-filter-bar" style="margin-bottom:6px"></div>
      <div id="spec-filter-bar" style="margin-bottom:10px"></div>
      <div id="recipe-list"></div>
    </div>
  </div>

  <!-- レシピ登録タブ -->
  <div id="tab-add-recipe" style="display:none">
    <h1>➕ レシピ登録</h1>

    <!-- ネット検索 -->
    <div class="card" style="border:2px dashed var(--green);background:rgba(74,158,107,0.05);margin-bottom:12px">
      <div class="section-title">🔍 ネットからレシピを探す</div>
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <input class="input" id="search-ing-input" placeholder="食材を入力（例：鶏肉、じゃがいも）" style="flex:1">
        <button class="btn btn-small" style="background:var(--green);color:#fff;border:none" onclick="searchOnlineRecipes()">検索</button>
      </div>
      <div style="font-size:12px;color:var(--text2)">空欄のままで食材タブの食材で検索</div>
      <div id="search-results" style="margin-top:12px"></div>
    </div>

    <!-- 写真から読み込み -->
    <div class="card" style="border:2px dashed var(--accent);background:rgba(224,123,57,0.05);margin-bottom:12px">
      <div class="section-title">📷 写真からレシピを読み込む</div>
      <input type="file" id="recipe-photo-input" accept="image/*" capture="environment" style="display:none" onchange="readRecipePhoto(event)">
      <button class="btn btn-primary" style="background:var(--accent);margin-top:0" onclick="document.getElementById('recipe-photo-input').click()">
        📸 レシピ写真を撮影・選択
      </button>
      <div id="recipe-photo-preview" style="margin-top:10px;display:none">
        <img id="recipe-photo-img" style="width:100%;border-radius:8px;max-height:200px;object-fit:cover">
        <div id="recipe-photo-status" style="font-size:13px;color:var(--text2);margin-top:6px;text-align:center"></div>
      </div>
    </div>

    <!-- 手動入力 -->
    <div class="card">
      <div class="section-title">手動で入力</div>
      <input class="input" id="recipe-name" placeholder="料理名" style="margin-bottom:8px">
      <input class="input" id="recipe-ingredients" placeholder="材料（カンマ区切り）例：鶏肉,玉ねぎ" style="margin-bottom:8px">
      <textarea class="input" id="recipe-steps" placeholder="作り方（省略可）" style="margin-bottom:8px"></textarea>
      <div class="section-title" style="margin-bottom:6px">カテゴリ</div>
      <div id="recipe-cat-select" style="margin-bottom:8px"></div>
      <button class="btn btn-primary" onclick="saveRecipe()">レシピを保存</button>
    </div>
  </div>

  <!-- 献立タブ -->
  <div id="tab-plan" style="display:none">
    <h1>🍱 献立提案</h1>
    <div id="plan-content"><div class="loading">「食材で献立を作る」ボタンを押してください</div></div>
  </div>

  <!-- 買い物タブ -->
  <div id="tab-shopping" style="display:none">
    <h1>🛒 買い物リスト</h1>
    <div id="shopping-content"><div class="loading">献立を作成すると買い物リストが生成されます</div></div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-bg" id="detail-modal" onclick="closeDetailModal(event)">
  <div class="modal" style="padding-bottom:32px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
      <div style="flex:1">
        <div id="detail-name" style="font-size:22px;font-weight:800;margin-bottom:6px"></div>
        <div id="detail-tags" style="margin-bottom:4px"></div>
      </div>
      <button id="detail-fav-btn" style="background:none;border:none;font-size:28px;cursor:pointer;padding:0 0 0 8px;line-height:1"></button>
    </div>
    <div style="background:var(--surface2);border-radius:12px;padding:14px;margin-bottom:14px">
      <div class="section-title" style="margin-bottom:8px">🧂 材料</div>
      <div id="detail-ingredients" style="font-size:15px;line-height:1.9"></div>
    </div>
    <div id="detail-steps-wrap" style="background:var(--surface2);border-radius:12px;padding:14px;margin-bottom:16px;display:none">
      <div class="section-title" style="margin-bottom:8px">👨‍🍳 作り方</div>
      <div id="detail-steps" style="font-size:14px;line-height:1.8;color:var(--text)"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <button class="btn" style="background:var(--surface2);border:1px solid var(--border);margin-top:0" onclick="closeDetailModal()">閉じる</button>
      <button class="btn btn-primary" style="margin-top:0" id="detail-edit-btn">✏️ 編集</button>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-bg" id="edit-modal" onclick="closeEditModal(event)">
  <div class="modal">
    <div class="modal-title">✏️ レシピを編集</div>
    <input class="input" id="edit-name" placeholder="料理名" style="margin-bottom:8px">
    <input class="input" id="edit-ingredients" placeholder="材料（カンマ区切り）" style="margin-bottom:8px">
    <textarea class="input" id="edit-steps" placeholder="作り方（省略可）" style="margin-bottom:8px"></textarea>
    <div class="section-title" style="margin-bottom:6px">カテゴリ</div>
    <div id="edit-cat-select" style="margin-bottom:12px"></div>
    <div class="section-title" style="margin-bottom:6px">タグ</div>
    <div id="edit-spec-tags" style="margin-bottom:16px"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <button class="btn" style="background:var(--surface2);border:1px solid var(--border)" onclick="closeEditModal()">キャンセル</button>
      <button class="btn btn-primary" style="margin-top:0" onclick="saveEditRecipe()">保存</button>
    </div>
  </div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
  <button class="nav-btn active" id="btn-ingredients" onclick="showTab('ingredients')">
    <span class="nav-icon">🥕</span>食材
  </button>
  <button class="nav-btn" id="btn-recipes" onclick="showTab('recipes')">
    <span class="nav-icon">📖</span>レシピ
  </button>
  <button class="nav-btn" id="btn-add-recipe" onclick="showTab('add-recipe')">
    <span class="nav-icon">➕</span>登録
  </button>
  <button class="nav-btn" id="btn-plan" onclick="showTab('plan')">
    <span class="nav-icon">🍱</span>献立
  </button>
  <button class="nav-btn" id="btn-shopping" onclick="showTab('shopping')">
    <span class="nav-icon">🛒</span>買い物
  </button>
</div>

<script>
const TABS = ['ingredients','recipes','add-recipe','plan','shopping']
let ingredients = JSON.parse(localStorage.getItem('ingredients') || '[]')
let recipes = JSON.parse(localStorage.getItem('recipes') || '[]')
let shoppingList = JSON.parse(localStorage.getItem('shoppingList') || '[]')
async function callApi(body) {
  const res = await fetch('/api/suggest', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  })
  const data = await res.json()
  if (!res.ok || data.error) throw new Error(data.error || 'APIエラー')
  return data.text
}

function showTab(tab) {
  TABS.forEach(t => {
    document.getElementById('tab-' + t).style.display = t === tab ? 'block' : 'none'
    document.getElementById('btn-' + t).classList.toggle('active', t === tab)
  })
  if (tab === 'recipes') { renderRecipes() }
  if (tab === 'add-recipe') { initCatSelect() }
  if (tab === 'shopping') renderShopping()
}

function notify(msg) {
  const el = document.getElementById('notif')
  el.textContent = msg
  el.classList.add('show')
  setTimeout(() => el.classList.remove('show'), 2500)
}

// 食材管理
function renderIngredients() {
  const el = document.getElementById('ing-tags')
  el.innerHTML = ingredients.map((ing, i) => 
    `<span class="tag tag-remove" onclick="removeIngredient(${i})">✕ ${ing}</span>`
  ).join('')
}

function addIngredient() {
  const input = document.getElementById('ing-input')
  const vals = input.value.split(/[,、，\s]+/).map(v => v.trim()).filter(Boolean)
  vals.forEach(v => { if (!ingredients.includes(v)) ingredients.push(v) })
  localStorage.setItem('ingredients', JSON.stringify(ingredients))
  input.value = ''
  renderIngredients()
}

function removeIngredient(i) {
  ingredients.splice(i, 1)
  localStorage.setItem('ingredients', JSON.stringify(ingredients))
  renderIngredients()
}

document.getElementById('ing-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addIngredient()
})

// レシピ管理
function saveRecipe() {
  const name = document.getElementById('recipe-name').value.trim()
  const ings = document.getElementById('recipe-ingredients').value.trim()
  const steps = document.getElementById('recipe-steps').value.trim()
  const category = document.getElementById('recipe-cat-select').dataset.selected || ''
  if (!name || !ings) { notify('料理名と材料は必須です'); return }
  recipes.push({ id: Date.now(), name, ingredients: ings, steps, category })
  localStorage.setItem('recipes', JSON.stringify(recipes))
  document.getElementById('recipe-name').value = ''
  document.getElementById('recipe-ingredients').value = ''
  document.getElementById('recipe-steps').value = ''
  initCatSelect()
  notify('レシピを保存しました！')
  showTab('recipes')
}

function deleteRecipe(id) {
  recipes = recipes.filter(r => r.id !== id)
  localStorage.setItem('recipes', JSON.stringify(recipes))
  renderRecipes()
}

const CATEGORIES = ['メイン料理','副菜','汁物','箸休め','おつまみ','麺','ご飯もの','鍋・煮物','炒め物','揚げ物','蒸し料理','サラダ','デザート','パン・粉もの','朝食向け','弁当向け','その他']
const SPEC_TAGS = ['お気に入り','子供向け','大人向け','簡単','時短','作り置き','ヘルシー','節約']
let editingId = null
let selectedCategory = 'すべて'
let selectedTags = new Set()
let recipeView = 'list'
let selectedIngredient = null

function initCatSelect() {
  document.getElementById('recipe-cat-select').innerHTML =
    ['未選択', ...CATEGORIES].map(c =>
      `<span class="cat-tag cat-${c === '未選択' ? 'その他' : c} ${c === '未選択' ? 'active' : ''}" id="cat-sel-${c}" onclick="selectCat('${c}')">${c}</span>`
    ).join('')
}

function selectCat(c) {
  document.querySelectorAll('#recipe-cat-select .cat-tag').forEach(el => el.classList.remove('active'))
  document.getElementById('cat-sel-' + c).classList.add('active')
  document.getElementById('recipe-cat-select').dataset.selected = c === '未選択' ? '' : c
}

function renderCatFilter() {
  const counts = { すべて: recipes.length }
  recipes.forEach(r => {
    const c = r.category || 'その他'
    counts[c] = (counts[c] || 0) + 1
  })
  document.getElementById('cat-filter-bar').innerHTML =
    ['すべて', ...CATEGORIES].filter(c => c === 'すべて' || counts[c]).map(c =>
      `<span class="cat-tag cat-${c === 'すべて' ? 'その他' : c} ${selectedCategory === c ? 'active' : ''}" onclick="filterCat('${c}')">
        ${c}${counts[c] && c !== 'すべて' ? ` <span style="opacity:0.7;font-size:10px">${counts[c]}</span>` : ''}
      </span>`
    ).join('')
}

function filterCat(c) {
  selectedCategory = c
  renderRecipes()
}

function renderSpecFilter() {
  // 使われているタグのみ表示
  const usedTags = new Set(recipes.flatMap(r => r.tags || []))
  if (usedTags.size === 0) {
    document.getElementById('spec-filter-bar').innerHTML = ''
    return
  }
  const allSpecTags = ['お気に入り', ...SPEC_TAGS.filter(t => t !== 'お気に入り')]
  document.getElementById('spec-filter-bar').innerHTML =
    allSpecTags.filter(t => usedTags.has(t)).map(t =>
      `<span class="spec-tag spec-${t} ${selectedTags.has(t) ? 'active' : ''}" onclick="toggleTagFilter('${t}')">${t === 'お気に入り' ? '⭐' : ''} ${t}</span>`
    ).join('')
}

function toggleTagFilter(t) {
  if (selectedTags.has(t)) selectedTags.delete(t)
  else selectedTags.add(t)
  renderRecipes()
}

function setRecipeView(view) {
  recipeView = view
  document.getElementById('recipe-view-list').style.display = view === 'list' ? 'block' : 'none'
  document.getElementById('recipe-view-ingredient').style.display = view === 'ingredient' ? 'block' : 'none'
  document.getElementById('view-btn-list').style.cssText = view === 'list' ? 'flex:1;background:var(--accent);color:#fff' : 'flex:1'
  document.getElementById('view-btn-ingredient').style.cssText = view === 'ingredient' ? 'flex:1;background:var(--accent);color:#fff' : 'flex:1'
  if (view === 'ingredient') renderIngredientView()
}

function renderIngredientView() {
  // 全レシピから食材を抽出してユニーク化
  const allIngs = {}
  const SEASONINGS = new Set(['醤油','塩','砂糖','みりん','酒','酢','味噌','ごま油','オリーブオイル','油','バター','小麦粉','片栗粉','だし','だし汁','水','お湯','コショウ','胡椒','塩こしょう','塩胡椒','ケチャップ','マヨネーズ','ソース','みそ','豆板醤','オイスターソース','ナンプラー','コンソメ','鶏ガラ','牛乳','生クリーム','はちみつ','蜂蜜','ポン酢','めんつゆ','ドレッシング','カレー粉','マスタード','にんにく','生姜','しょうが'])
  recipes.forEach(r => {
    r.ingredients.split(/[,、，]+/).map(i =>
      i.trim().replace(/[\d０-９]+\s*(?:g|ml|cc|kg|L|個|枚|本|袋|缶|パック|カップ|大さじ|小さじ|少々|適量|少量|適宜)[^\S]*/gi, '').trim()
    ).filter(ing => ing && !SEASONINGS.has(ing)).forEach(ing => {
      if (!allIngs[ing]) allIngs[ing] = []
      allIngs[ing].push(r)
    })
  })

  const sorted = Object.entries(allIngs).sort((a, b) => b[1].length - a[1].length)

  if (sorted.length === 0) {
    document.getElementById('ingredient-filter').innerHTML = '<div class="loading">レシピがまだありません</div>'
    document.getElementById('ingredient-recipe-list').innerHTML = ''
    return
  }

  // 食材タグ一覧
  document.getElementById('ingredient-filter').innerHTML = sorted.map(([ing, rs]) =>
    `<span class="tag ${selectedIngredient === ing ? 'active' : ''}" onclick="filterByIngredient('${ing.replace(/'/g,"\\'")}')">
      ${ing}${rs.length > 1 ? ` <span style="opacity:0.7">${rs.length}</span>` : ''}
    </span>`
  ).join('')

  // 選択中食材のレシピ
  if (!selectedIngredient || !allIngs[selectedIngredient]) {
    selectedIngredient = sorted[0][0]
    renderIngredientView()
    return
  }

  const matched = allIngs[selectedIngredient] || []
  document.getElementById('ingredient-recipe-list').innerHTML = `
    <div class="section-title" style="margin-bottom:8px">「${selectedIngredient}」を使うレシピ（${matched.length}件）</div>
    ${matched.map(r => `
      <div class="recipe-item">
        <div class="recipe-name">${r.name}</div>
        <div class="recipe-meta">材料: ${r.ingredients}</div>
        ${r.steps ? `<div class="recipe-meta" style="margin-top:4px">${r.steps.slice(0,60)}${r.steps.length>60?'...':''}</div>` : ''}
        <div class="recipe-actions">
          <button class="btn btn-danger" onclick="deleteRecipe(${r.id});renderIngredientView()">削除</button>
        </div>
      </div>
    `).join('')}
  `
}

// ネットレシピ検索
async function searchOnlineRecipes() {
  const input = document.getElementById('search-ing-input').value.trim()
  const searchIngs = input
    ? input.split(/[,、，\s]+/).map(s => s.trim()).filter(Boolean)
    : ingredients

  if (searchIngs.length === 0) {
    notify('食材を入力するか、食材タブで食材を追加してください')
    return
  }

  const el = document.getElementById('search-results')
  el.innerHTML = '<div class="loading">🌐 ネットでレシピを検索中...</div>'

  try {
    const text = await callApi({ type: 'search', ingredients: searchIngs })
    const match = text.match(/\[[\s\S]*\]/)
    if (!match) throw new Error('レシピが見つかりませんでした')
    const found = JSON.parse(match[0])

    el.innerHTML = `
      <div class="section-title" style="margin-bottom:8px">「${searchIngs.slice(0,3).join('・')}」のレシピ（${found.length}件）</div>
      ${found.map((r, i) => `
        <div class="recipe-item" style="margin-bottom:8px">
          <div class="recipe-name">${r.name}</div>
          <div class="recipe-meta">材料: ${r.ingredients}</div>
          ${r.steps ? `<div class="recipe-meta" style="margin-top:4px">${r.steps}</div>` : ''}
          ${r.source ? `<div class="recipe-meta" style="margin-top:4px;color:var(--green)">📌 ${r.source}</div>` : ''}
          <div class="recipe-actions" style="margin-top:8px">
            <button class="btn btn-small" style="background:var(--green);color:#fff;border:none" onclick="addFoundRecipe(${i})">+ 登録する</button>
          </div>
        </div>
      `).join('')}
    `
    // 検索結果を一時保存
    window._foundRecipes = found
  } catch (e) {
    el.innerHTML = `<div class="loading" style="color:var(--red)">エラー: ${e.message}</div>`
  }
}

function addFoundRecipe(i) {
  const r = window._foundRecipes?.[i]
  if (!r) return
  recipes.push({ id: Date.now(), name: r.name, ingredients: r.ingredients, steps: r.steps || '', category: r.category || '' })
  localStorage.setItem('recipes', JSON.stringify(recipes))
  notify(`「${r.name}」をレシピに登録しました！`)
  renderRecipes()
}

function filterByIngredient(ing) {
  selectedIngredient = ing
  renderIngredientView()
}

function renderRecipes() {
  renderCatFilter()
  renderSpecFilter()
  const searchQ = (document.getElementById('recipe-search')?.value || '').trim().toLowerCase()
  const el = document.getElementById('recipe-list')
  let filtered = selectedCategory === 'すべて'
    ? recipes
    : recipes.filter(r => (r.category || 'その他') === selectedCategory)
  // タグフィルター（選択タグを全て持つもの）
  if (selectedTags.size > 0) {
    filtered = filtered.filter(r => [...selectedTags].every(t => (r.tags || []).includes(t)))
  }
  // テキスト検索
  if (searchQ) {
    filtered = filtered.filter(r => r.name.toLowerCase().includes(searchQ) || r.ingredients.toLowerCase().includes(searchQ))
  }
  if (recipes.length === 0) {
    el.innerHTML = '<div class="loading">レシピがまだありません</div>'
    return
  }
  if (filtered.length === 0) {
    el.innerHTML = '<div class="loading">このカテゴリのレシピはありません</div>'
    return
  }
  // お気に入りを上に
  filtered = [...filtered].sort((a, b) => (b.tags?.includes('お気に入り') ? 1 : 0) - (a.tags?.includes('お気に入り') ? 1 : 0))
  el.innerHTML = filtered.map(r => {
    const isFav = r.tags?.includes('お気に入り')
    const specTags = (r.tags || []).filter(t => t !== 'お気に入り')
    return `
    <div class="recipe-item" style="cursor:pointer" onclick="openDetailModal(${r.id})">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span class="recipe-name">${r.name}</span>
          ${r.category ? `<span class="cat-tag cat-${r.category}">${r.category}</span>` : ''}
          ${specTags.map(t => `<span class="spec-tag spec-${t} active" style="font-size:10px;padding:1px 7px">${t}</span>`).join('')}
        </div>
        <button class="fav-btn" onclick="event.stopPropagation();toggleFav(${r.id})">${isFav ? '⭐' : '☆'}</button>
      </div>
      <div class="recipe-meta">材料: ${r.ingredients.slice(0,50)}${r.ingredients.length>50?'...':''}</div>
      ${r.steps ? `<div class="recipe-meta" style="margin-top:2px">${r.steps.slice(0,40)}${r.steps.length>40?'...':''}</div>` : ''}
    </div>`
  }).join('')
}

function openDetailModal(id) {
  const r = recipes.find(r => r.id === id)
  if (!r) return
  const isFav = r.tags?.includes('お気に入り')
  const allTags = r.tags || []

  document.getElementById('detail-name').textContent = r.name
  document.getElementById('detail-fav-btn').textContent = isFav ? '⭐' : '☆'
  document.getElementById('detail-fav-btn').onclick = () => { toggleFav(id); openDetailModal(id) }

  // タグ表示
  const tagHtml = [
    r.category ? `<span class="cat-tag cat-${r.category}">${r.category}</span>` : '',
    ...allTags.filter(t => t !== 'お気に入り').map(t => `<span class="spec-tag spec-${t} active">${t}</span>`)
  ].join('')
  document.getElementById('detail-tags').innerHTML = tagHtml

  // 材料を箇条書きに
  const ings = r.ingredients.split(/[,、，]+/).map(i => i.trim()).filter(Boolean)
  document.getElementById('detail-ingredients').innerHTML = ings.map(i => `• ${i}`).join('<br>')

  // 作り方
  const stepsWrap = document.getElementById('detail-steps-wrap')
  if (r.steps) {
    stepsWrap.style.display = 'block'
    document.getElementById('detail-steps').textContent = r.steps
  } else {
    stepsWrap.style.display = 'none'
  }

  // 編集ボタン
  document.getElementById('detail-edit-btn').onclick = () => { closeDetailModal(); openEditModal(id) }

  document.getElementById('detail-modal').classList.add('show')
}

function closeDetailModal(e) {
  if (e && e.target !== document.getElementById('detail-modal')) return
  document.getElementById('detail-modal').classList.remove('show')
}

function toggleFav(id) {
  const r = recipes.find(r => r.id === id)
  if (!r) return
  r.tags = r.tags || []
  if (r.tags.includes('お気に入り')) r.tags = r.tags.filter(t => t !== 'お気に入り')
  else r.tags.unshift('お気に入り')
  localStorage.setItem('recipes', JSON.stringify(recipes))
  renderRecipes()
}

function openEditModal(id) {
  const r = recipes.find(r => r.id === id)
  if (!r) return
  editingId = id
  document.getElementById('edit-name').value = r.name
  document.getElementById('edit-ingredients').value = r.ingredients
  document.getElementById('edit-steps').value = r.steps || ''
  // カテゴリ
  const catEl = document.getElementById('edit-cat-select')
  catEl.dataset.selected = r.category || ''
  catEl.innerHTML = ['未選択', ...CATEGORIES].map(c =>
    `<span class="cat-tag cat-${c === '未選択' ? 'その他' : c} ${(r.category || '') === (c === '未選択' ? '' : c) ? 'active' : ''}" onclick="editSelectCat('${c}')">${c}</span>`
  ).join('')
  // タグ
  const curTags = r.tags || []
  document.getElementById('edit-spec-tags').innerHTML = SPEC_TAGS.map(t =>
    `<span class="spec-tag spec-${t} ${curTags.includes(t) ? 'active' : ''}" onclick="toggleEditTag('${t}')">${t}</span>`
  ).join('')
  document.getElementById('edit-modal').classList.add('show')
}

function editSelectCat(c) {
  const el = document.getElementById('edit-cat-select')
  el.dataset.selected = c === '未選択' ? '' : c
  el.querySelectorAll('.cat-tag').forEach(tag => tag.classList.remove('active'))
  event.target.classList.add('active')
}

function toggleEditTag(t) {
  const el = event.target
  el.classList.toggle('active')
}

function saveEditRecipe() {
  const r = recipes.find(r => r.id === editingId)
  if (!r) return
  r.name = document.getElementById('edit-name').value.trim()
  r.ingredients = document.getElementById('edit-ingredients').value.trim()
  r.steps = document.getElementById('edit-steps').value.trim()
  r.category = document.getElementById('edit-cat-select').dataset.selected || ''
  r.tags = [...document.querySelectorAll('#edit-spec-tags .spec-tag.active')].map(el => el.textContent)
  localStorage.setItem('recipes', JSON.stringify(recipes))
  closeEditModal()
  renderRecipes()
  notify('レシピを更新しました！')
}

function closeEditModal(e) {
  if (e && e.target !== document.getElementById('edit-modal')) return
  document.getElementById('edit-modal').classList.remove('show')
  editingId = null
}

// 献立生成
async function generatePlan() {
  const planEl = document.getElementById('plan-content')
  planEl.innerHTML = '<div class="loading">🤖 AIが献立を考えています...</div>'
  try {
    const text = await callApi({ type: 'plan', ingredients, recipes })
    const match = text.match(/\[[\s\S]*\]/)
    if (!match) throw new Error('レスポンスの形式が不正です')
    const plan = JSON.parse(match[0])
    renderPlan(plan)
    const allMissing = [...new Set(plan.flatMap(p => p.missing || []))]
    shoppingList = allMissing.map(item => ({ name: item, checked: false }))
    localStorage.setItem('shoppingList', JSON.stringify(shoppingList))
    notify('献立と買い物リストを生成しました！')
  } catch (e) {
    planEl.innerHTML = `<div class="loading" style="color:var(--red)">エラー: ${e.message}</div>`
  }
}

function renderPlan(plan) {
  const el = document.getElementById('plan-content')
  el.innerHTML = `
    <button class="btn btn-primary" onclick="generatePlan()" style="margin-bottom:14px">🔄 再生成</button>
    ${plan.map(p => `
      <div class="meal-item">
        <div class="meal-day">${p.day}</div>
        <div style="display:grid;gap:4px;margin:6px 0">
          <div><span style="font-size:11px;color:var(--text2)">朝</span> <span class="meal-name" style="font-size:14px">${p.meals.朝||'—'}</span></div>
          <div><span style="font-size:11px;color:var(--text2)">昼</span> <span class="meal-name" style="font-size:14px">${p.meals.昼||'—'}</span></div>
          <div><span style="font-size:11px;color:var(--text2)">夜</span> <span class="meal-name" style="font-size:14px">${p.meals.夜||'—'}</span></div>
        </div>
        ${p.note ? `<div class="meal-note">💬 ${p.note}</div>` : ''}
        ${p.missing?.length ? `<div class="meal-note" style="color:var(--accent)">🛒 必要: ${p.missing.join('、')}</div>` : ''}
      </div>
    `).join('')}
  `
}

// 買い物リスト
function renderShopping() {
  const el = document.getElementById('shopping-content')
  if (shoppingList.length === 0) {
    el.innerHTML = '<div class="loading">献立を作成すると買い物リストが生成されます</div>'
    return
  }
  const done = shoppingList.filter(s => s.checked).length
  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <span style="font-size:13px;color:var(--text2)">${done}/${shoppingList.length} 完了</span>
      <button class="btn btn-small" onclick="clearChecked()">チェック済みを削除</button>
    </div>
    <div class="card" style="padding:0 16px">
      ${shoppingList.map((s, i) => `
        <div class="shop-item">
          <div class="shop-check ${s.checked ? 'checked' : ''}" onclick="toggleShop(${i})">
            ${s.checked ? '✓' : ''}
          </div>
          <span class="shop-name ${s.checked ? 'done' : ''}">${s.name}</span>
        </div>
      `).join('')}
    </div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <input class="input" id="shop-input" placeholder="追加する食材..." style="flex:1">
      <button class="btn btn-small" onclick="addShopItem()">追加</button>
    </div>
  `
}

function toggleShop(i) {
  shoppingList[i].checked = !shoppingList[i].checked
  localStorage.setItem('shoppingList', JSON.stringify(shoppingList))
  renderShopping()
}

function clearChecked() {
  shoppingList = shoppingList.filter(s => !s.checked)
  localStorage.setItem('shoppingList', JSON.stringify(shoppingList))
  renderShopping()
}

function addShopItem() {
  const input = document.getElementById('shop-input')
  const val = input.value.trim()
  if (val) {
    shoppingList.push({ name: val, checked: false })
    localStorage.setItem('shoppingList', JSON.stringify(shoppingList))
    input.value = ''
    renderShopping()
  }
}

// レシピ写真読み取り
async function readRecipePhoto(event) {
  const file = event.target.files[0]
  if (!file) return
  const preview = document.getElementById('recipe-photo-preview')
  const img = document.getElementById('recipe-photo-img')
  const status = document.getElementById('recipe-photo-status')
  preview.style.display = 'block'
  img.src = URL.createObjectURL(file)
  status.style.color = 'var(--text2)'
  status.textContent = '🤖 レシピを読み取り中...'
  const base64 = await new Promise(resolve => {
    const reader = new FileReader()
    reader.onload = e => resolve(e.target.result.split(',')[1])
    reader.readAsDataURL(file)
  })
  try {
    const text = await callApi({ type: 'recipe', imageBase64: base64, imageType: file.type })
    const match = text.match(/\{[\s\S]*\}/)
    if (!match) throw new Error('レシピを読み取れませんでした')
    const recipe = JSON.parse(match[0])
    if (recipe.error) throw new Error(recipe.error)
    document.getElementById('recipe-name').value = recipe.name || ''
    document.getElementById('recipe-ingredients').value = recipe.ingredients || ''
    document.getElementById('recipe-steps').value = recipe.steps || ''
    status.textContent = `✅ 「${recipe.name}」を読み取りました。内容を確認して保存してください。`
    status.style.color = 'var(--green)'
    notify('レシピを読み取りました！内容を確認して保存してください。')
  } catch (e) {
    status.textContent = `❌ エラー: ${e.message}`
    status.style.color = 'var(--red)'
  }
  event.target.value = ''
}

// レシート読み取り
async function readReceipt(event) {
  const file = event.target.files[0]
  if (!file) return
  const preview = document.getElementById('receipt-preview')
  const img = document.getElementById('receipt-img')
  const status = document.getElementById('receipt-status')
  preview.style.display = 'block'
  img.src = URL.createObjectURL(file)
  status.style.color = 'var(--text2)'
  status.textContent = '🤖 レシートを解析中...'
  const base64 = await new Promise(resolve => {
    const reader = new FileReader()
    reader.onload = e => resolve(e.target.result.split(',')[1])
    reader.readAsDataURL(file)
  })
  try {
    const text = await callApi({ type: 'receipt', imageBase64: base64, imageType: file.type })
    const match = text.match(/\[[\s\S]*\]/)
    if (!match) throw new Error('食材を読み取れませんでした')
    const extracted = JSON.parse(match[0])
    let added = 0
    extracted.forEach(item => {
      const clean = item.trim()
      if (clean && !ingredients.includes(clean)) { ingredients.push(clean); added++ }
    })
    localStorage.setItem('ingredients', JSON.stringify(ingredients))
    renderIngredients()
    status.textContent = `✅ ${extracted.length}品目を読み取り、${added}件を追加しました`
    status.style.color = 'var(--green)'
    notify(`${added}件の食材を追加しました！`)
    setTimeout(() => {
      if (confirm(`${added}件の食材を追加しました。\nそのまま献立を作りますか？`)) {
        showTab('plan'); generatePlan()
      }
    }, 500)
  } catch (e) {
    status.textContent = `❌ エラー: ${e.message}`
    status.style.color = 'var(--red)'
  }
  event.target.value = ''
}

// 初期化
renderIngredients()
